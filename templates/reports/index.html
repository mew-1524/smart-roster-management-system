{% extends "base.html" %}{% block title %}Reports{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Reports</h1><div class="sub">Built from the saved roster. Exports match the filters on screen.</div></div></div>
<div class="row g-3">{% for key, title, desc, icon in reports %}<div class="col-md-6"><div class="card h-100"><div class="card-body d-flex gap-3"><div class="stat p-0"><div class="ico ico-primary"><i class="bi bi-{{ icon }}"></i></div></div><div class="flex-grow-1"><h5>{{ title }}</h5><p class="text-muted small">{{ desc }}</p>
<a class="btn btn-sm btn-primary" href="{% url 'report_'|add:key %}?year={{ year }}&month={{ month }}">Open</a> <a class="btn btn-sm btn-outline-secondary" href="{% url 'report_'|add:key %}?year={{ year }}&month={{ month }}&format=csv">CSV</a></div></div></div></div>{% endfor %}</div>
{% endblock %}
