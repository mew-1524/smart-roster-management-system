{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block anon %}
<div class="login-bg"><div class="card login-card p-4">
  <div class="d-flex align-items-center gap-2 mb-3"><i class="bi bi-calendar2-week fs-3 text-primary"></i><div><div class="fw-bold fs-5">Smart Roster</div><div class="text-muted small">Operations manager sign-in</div></div></div>
  {% if form.errors %}<div class="alert alert-danger py-2">Username or password is incorrect.</div>{% endif %}
  <form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
    <label class="form-label">Username</label><input class="form-control mb-3" name="username" autofocus required>
    <label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
    <button class="btn btn-primary w-100">Sign in</button>
  </form>
</div></div>
{% endblock %}
