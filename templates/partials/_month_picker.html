<select name="month" class="form-select form-select-sm w-auto">{% for m in months %}<option value="{{ m }}" {% if m == month %}selected{% endif %}>{{ m|stringformat:"02d" }}</option>{% endfor %}</select>
<select name="year" class="form-select form-select-sm w-auto">{% for y in years %}<option value="{{ y }}" {% if y == year %}selected{% endif %}>{{ y }}</option>{% endfor %}</select>
